plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.karaokeaudio'
version = '1.0.0'

// Pinned to the React Native 0.88 / Expo SDK 58 toolchain so a clean
// `npx expo prebuild` on ubuntu-latest can compile the Oboe engine.
// NDK r27, CMake 3.22.1 (AGP default, also installed in CI), Oboe 1.10.0 Prefab.
def karaokeNdkVersion = rootProject.ext.has("ndkVersion") ? rootProject.ext.get("ndkVersion") : "27.1.12297006"

android {
  namespace "expo.modules.karaokeaudio"
  ndkVersion karaokeNdkVersion

  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles 'consumer-rules.pro'
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17"
        arguments "-DANDROID_STL=c++_shared",
            "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }

  buildFeatures {
    prefab true
  }

  sourceSets {
    main {
      // Vocal DSP and routing policy are plain Kotlin so they can be unit
      // tested on a JVM. The audio thread in this module calls into them.
      java.srcDirs += "$projectDir/../core/src/main/kotlin"
    }
  }

  packaging {
    jniLibs {
      // React Native already packages one libc++_shared.so.
      excludes += ["**/libc++_shared.so"]
    }
  }

  lint {
    abortOnError = false
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.google.oboe:oboe:1.10.0"
  implementation "androidx.core:core-ktx:1.13.1"
}
